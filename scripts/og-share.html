<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pine: #0f231b;
      --cream: #e8dfd0;
      --gold: #c9a24a;
      --brass: #b8954a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2400px;
      height: 1260px;
      overflow: hidden;
      background: var(--pine);
    }
    .card {
      width: 2400px;
      height: 1260px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 75% 65% at 50% 40%, #1c3227 0%, transparent 65%),
        var(--pine);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.38;
      pointer-events: none;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .products { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .products img {
      position: absolute;
      object-fit: contain;
      filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.45));
    }
    .p1 { left: 1%; bottom: -3%; height: 60%; transform: rotate(-7deg); }
    .p2 { left: 10%; bottom: -8%; height: 52%; transform: rotate(-2deg); opacity: 0.95; }
    .p3 { left: 19%; bottom: -4%; height: 48%; transform: rotate(4deg); opacity: 0.92; }
    .p4 { left: 27%; bottom: -11%; height: 40%; transform: rotate(-5deg); opacity: 0.88; }
    .p5 { right: 27%; bottom: -10%; height: 41%; transform: rotate(6deg); opacity: 0.88; }
    .p6 { right: 18%; bottom: -3%; height: 50%; transform: rotate(-3deg); opacity: 0.92; }
    .p7 { right: 9%; bottom: -7%; height: 55%; transform: rotate(5deg); }
    .p8 { right: 0%; bottom: -2%; height: 62%; transform: rotate(8deg); }
    .p9 { left: 5%; top: 7%; height: 26%; transform: rotate(-12deg); opacity: 0.75; }
    .p10 { right: 4%; top: 8%; height: 24%; transform: rotate(10deg); opacity: 0.75; }
    .p11 { left: 35%; bottom: -13%; height: 34%; transform: rotate(3deg); opacity: 0.8; }
    .p12 { right: 35%; bottom: -12%; height: 33%; transform: rotate(-4deg); opacity: 0.8; }
    .veil {
      position: absolute;
      inset: 0;
      z-index: 3;
      background:
        radial-gradient(ellipse 46% 40% at 50% 42%, rgba(15, 35, 27, 0.62), rgba(15, 35, 27, 0.22) 58%, transparent 78%),
        linear-gradient(to bottom, rgba(15, 35, 27, 0.5) 0%, transparent 24%, transparent 58%, rgba(15, 35, 27, 0.4) 100%);
      pointer-events: none;
    }
    .copy {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 70px;
    }
    .get {
      font-family: "Work Sans", sans-serif;
      font-weight: 400;
      font-size: 28px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.1rem;
    }
    .heading {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-optical-sizing: auto;
      font-size: 168px;
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--cream);
      text-shadow: 0 4px 50px rgba(0, 0, 0, 0.3);
    }
    .heading em {
      font-style: italic;
      color: var(--gold);
      font-weight: 400;
    }
    .brand {
      margin-top: 1.85rem;
      font-family: "Fraunces", Georgia, serif;
      font-optical-sizing: auto;
      font-size: 36px;
      line-height: 1.1;
      color: var(--cream);
      opacity: 0.9;
    }
    .brand .with {
      font-style: italic;
      font-size: 0.7em;
      margin: 0 0.2em;
      position: relative;
      top: -0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="products" aria-hidden="true">
      <img class="p9" src="../public/products/caps/caps-immu.png" alt="" />
      <img class="p10" src="../public/products/caps/caps-moodoo.png" alt="" />
      <img class="p1" src="../public/products/fresh/fresh-cleanser.png" alt="" />
      <img class="p2" src="../public/products/fresh/fresh-hydro-serum.png" alt="" />
      <img class="p3" src="../public/products/fresh/fresh-anti-wrinkle-serum.png" alt="" />
      <img class="p4" src="../public/products/fresh/fresh-adds-glow.png" alt="" />
      <img class="p11" src="../public/products/packs/pack-antiox.png" alt="" />
      <img class="p12" src="../public/products/packs/pack-balancing.png" alt="" />
      <img class="p5" src="../public/products/fresh/fresh-adds-repair.png" alt="" />
      <img class="p6" src="../public/products/fresh/fresh-cream-medium.png" alt="" />
      <img class="p7" src="../public/products/fresh/fresh-eye-serum.png" alt="" />
      <img class="p8" src="../public/products/fresh/fresh-cream-rich.png" alt="" />
    </div>
    <div class="veil"></div>
    <div class="copy">
      <div class="get">Get your</div>
      <h1 class="heading">The Fresh <em>Match</em></h1>
      <div class="brand">Ringana <span class="with">with</span> Taylor</div>
    </div>
  </div>
</body>
</html>
