<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Sampled from brand OG */
      --pine: #10241b;
      --gold: #e3d7bf;
      --ornament: #c4a86a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2400px;
      height: 1260px;
      overflow: hidden;
      background: var(--pine);
    }
    .card {
      width: 2400px;
      height: 1260px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 60% at 50% 38%, #1a3328 0%, transparent 68%),
        var(--pine);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.42;
      pointer-events: none;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .copy {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 320px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .ornament {
      display: flex;
      align-items: center;
      margin-bottom: 2.1rem;
    }
    .ornament .line {
      width: 150px;
      height: 2px;
      background: var(--ornament);
    }
    .ornament .diamond {
      width: 11px;
      height: 11px;
      margin: 0 18px;
      background: var(--ornament);
      transform: rotate(45deg);
      flex-shrink: 0;
    }
    .get {
      font-family: "Work Sans", sans-serif;
      font-weight: 400;
      font-size: 26px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.15rem;
      opacity: 0.92;
    }
    .heading {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-optical-sizing: auto;
      font-size: 158px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--gold);
    }
    .heading em {
      font-style: italic;
      font-weight: 400;
      color: var(--gold);
    }
    .brand {
      margin-top: 1.9rem;
      font-family: "Fraunces", Georgia, serif;
      font-optical-sizing: auto;
      font-size: 34px;
      line-height: 1.1;
      color: var(--gold);
      opacity: 0.95;
    }
    .brand .with {
      font-style: italic;
      font-size: 0.68em;
      margin: 0 0.2em;
      position: relative;
      top: -0.06em;
    }
    .shelf {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 420px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 18px;
      padding: 0 56px 28px;
      pointer-events: none;
    }
    .shelf img {
      height: 340px;
      width: auto;
      max-width: 175px;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.38));
      flex: 0 0 auto;
    }
    /* Keep every product on the same baseline / similar visual weight */
    .shelf img.pack,
    .shelf img.cap {
      height: 250px;
      max-width: 210px;
      margin-bottom: 8px;
    }
    .veil {
      position: absolute;
      inset: 0;
      z-index: 3;
      background:
        linear-gradient(to bottom, transparent 48%, rgba(16, 36, 27, 0.2) 72%, rgba(16, 36, 27, 0.55) 100%),
        radial-gradient(ellipse 50% 42% at 50% 36%, rgba(16, 36, 27, 0.45), transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shelf" aria-hidden="true">
      <img src="../public/products/fresh/fresh-cleanser.png" alt="" />
      <img src="../public/products/fresh/fresh-cleansing-water.png" alt="" />
      <img src="../public/products/fresh/fresh-hydro-serum.png" alt="" />
      <img src="../public/products/fresh/fresh-anti-wrinkle-serum.png" alt="" />
      <img src="../public/products/fresh/fresh-adds-glow.png" alt="" />
      <img class="pack" src="../public/products/packs/pack-antiox.png" alt="" />
      <img class="cap" src="../public/products/caps/caps-immu.png" alt="" />
      <img class="cap" src="../public/products/caps/caps-moodoo.png" alt="" />
      <img src="../public/products/fresh/fresh-adds-repair.png" alt="" />
      <img src="../public/products/fresh/fresh-cream-medium.png" alt="" />
      <img src="../public/products/fresh/fresh-eye-serum.png" alt="" />
      <img src="../public/products/fresh/fresh-cream-rich.png" alt="" />
    </div>
    <div class="veil"></div>
    <div class="copy">
      <div class="ornament" aria-hidden="true">
        <span class="line"></span>
        <span class="diamond"></span>
        <span class="line"></span>
      </div>
      <div class="get">Get your</div>
      <h1 class="heading">The Fresh <em>Match</em></h1>
      <div class="brand">The Fresh <span class="with">Grove</span></div>
    </div>
  </div>
</body>
</html>
