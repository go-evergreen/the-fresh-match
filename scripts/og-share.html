<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #14231c;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%, rgba(40, 62, 48, 0.55), transparent 70%),
        #14231c;
      color: #ece6d6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Fraunces", Georgia, serif;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      mix-blend-mode: soft-light;
    }
    .ornament {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 1.65rem;
      position: relative;
      z-index: 2;
    }
    .ornament .line {
      width: 72px;
      height: 1px;
      background: #b8954a;
    }
    .ornament .diamond {
      width: 7px;
      height: 7px;
      background: #b8954a;
      transform: rotate(45deg);
      margin: 0 10px;
      flex-shrink: 0;
    }
    .lockup {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .ringana {
      font-family: "Fraunces", serif;
      font-weight: 400;
      font-optical-sizing: auto;
      font-size: 96px;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: #ece6d6;
    }
    .with-taylor {
      margin-top: 0.15em;
      font-size: 96px;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: #ece6d6;
    }
    .with-taylor .with {
      font-family: "Fraunces", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 0.52em;
      margin-right: 0.22em;
      vertical-align: baseline;
      position: relative;
      top: -0.08em;
    }
    .with-taylor .taylor {
      font-family: "Fraunces", serif;
      font-style: normal;
      font-weight: 400;
    }
    .tag {
      position: relative;
      z-index: 2;
      margin-top: 2.35rem;
      font-family: "Work Sans", sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: none;
      color: #ece6d6;
    }
    .prod {
      position: absolute;
      z-index: 1;
      object-fit: contain;
      opacity: 0.88;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.35));
      pointer-events: none;
    }
    .prod.left {
      left: -10px;
      bottom: -30px;
      height: 280px;
      transform: rotate(-8deg);
    }
    .prod.right {
      right: -5px;
      bottom: -40px;
      height: 250px;
      transform: rotate(7deg);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament" aria-hidden="true">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line"></span>
    </div>
    <div class="lockup">
      <div class="ringana">Ringana</div>
      <div class="with-taylor"><span class="with">with</span><span class="taylor">Taylor</span></div>
    </div>
    <p class="tag">Get your Fresh Match.</p>
    <img class="prod left" src="../public/products/fresh/fresh-hydro-serum.png" alt="" />
    <img class="prod right" src="../public/products/fresh/fresh-cream-medium.png" alt="" />
  </div>
</body>
</html>
